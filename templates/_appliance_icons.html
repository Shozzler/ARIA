{% macro appliance_icon_svg(type_label, css_class='appliance-icon-svg') %}
{%- if type_label == 'Oven' %}
<svg class="{{ css_class }}" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="6" width="36" height="36" rx="4"/>
    <line x1="6" y1="16" x2="42" y2="16"/>
    <circle cx="13" cy="11" r="1.5" fill="currentColor" stroke="none"/>
    <circle cx="20" cy="11" r="1.5" fill="currentColor" stroke="none"/>
    <circle cx="27" cy="11" r="1.5" fill="currentColor" stroke="none"/>
    <rect x="11" y="21" width="26" height="16" rx="2"/>
    <circle cx="24" cy="29" r="4"/>
</svg>
{%- elif type_label == 'FridgeFreezer' %}
<svg class="{{ css_class }}" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="4" width="28" height="40" rx="3"/>
    <line x1="10" y1="18" x2="38" y2="18"/>
    <line x1="15" y1="9" x2="15" y2="14"/>
    <line x1="15" y1="23" x2="15" y2="30"/>
</svg>
{%- elif type_label == 'Tumble dryer' %}
<svg class="{{ css_class }}" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="6" width="36" height="36" rx="4"/>
    <circle cx="24" cy="26" r="12"/>
    <circle cx="24" cy="26" r="5"/>
    <circle cx="13" cy="11" r="1.5" fill="currentColor" stroke="none"/>
    <circle cx="19" cy="11" r="1.5" fill="currentColor" stroke="none"/>
</svg>
{%- else %}
<svg class="{{ css_class }}" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 6v10M30 6v10M14 16h20v6a10 10 0 0 1-20 0v-6z"/>
    <line x1="24" y1="32" x2="24" y2="42"/>
</svg>
{%- endif %}
{% endmacro %}
