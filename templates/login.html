<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIA Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h1>ARIA</h1>
            <p class="subtitle">Automated Residential Intelligence Assistant (running from QNAP!)</p>

            {% if error %}
                <div class="error-message">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="/login" class="login-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        autofocus
                        placeholder="Enter your username"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        placeholder="Enter your password"
                    >
                </div>

                <button type="submit" class="btn-primary">Login</button>
            </form>

            <p class="hint">Use your credentials to access the ARIA dashboard</p>

            <p class="signup-link">
                Don't have an account? <a href="{{ url_for('signup_page') }}">Sign up here</a>
            </p>
        </div>
    </div>
</body>
</html>
